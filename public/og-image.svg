<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0C18" />
      <stop offset="100%" stop-color="#1E1538" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B80FF" />
      <stop offset="100%" stop-color="#7650E8" />
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <circle cx="1000" cy="150" r="300" fill="#7650E8" opacity="0.25" filter="url(#blurGlow)" />
  <circle cx="200" cy="500" r="260" fill="#FF625E" opacity="0.18" filter="url(#blurGlow)" />

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="2" />

  <!-- Brand ND Logo -->
  <rect x="80" y="80" width="76" height="76" rx="20" fill="url(#purpleGrad)" />
  <text x="118" y="132" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="34" text-anchor="middle">ND</text>
  <text x="180" y="124" fill="white" font-family="system-ui, sans-serif" font-weight="800" font-size="36">Next<tspan fill="#9B80FF">Dine</tspan></text>
  <text x="182" y="146" fill="#8E85A8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="3">RESTAURANT OS</text>

  <!-- Headline -->
  <text x="80" y="250" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="48">The Complete Digital Dining OS</text>
  <text x="80" y="310" fill="#9B80FF" font-family="system-ui, sans-serif" font-weight="900" font-size="48">Built For Modern Outlets.</text>

  <!-- Subtitle -->
  <text x="80" y="380" fill="#B4AEC8" font-family="system-ui, sans-serif" font-weight="500" font-size="22">Instant Table QR Ordering • 0.2s Kitchen Display Stream (KDS)</text>
  <text x="80" y="415" fill="#8E85A8" font-family="system-ui, sans-serif" font-weight="500" font-size="20">Visual Menus • Flat ₹999/mo • 100% Direct Revenue</text>

  <!-- Pricing Badge -->
  <rect x="880" y="80" width="240" height="130" rx="24" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.15" stroke-width="1.5" />
  <text x="904" y="116" fill="#FF625E" font-family="system-ui, sans-serif" font-weight="800" font-size="14" letter-spacing="2">UNLIMITED PLAN</text>
  <text x="904" y="162" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="44">₹999<tspan fill="#8E85A8" font-size="20" font-weight="500"> / mo</tspan></text>
  <text x="904" y="194" fill="#2ECC71" font-family="system-ui, sans-serif" font-weight="700" font-size="14">0% Commission Cuts</text>
</svg>
