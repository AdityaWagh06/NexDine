<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ndGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B66FF" />
      <stop offset="100%" stop-color="#643ED8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ndGradient)" stroke="#9F80FF" stroke-width="1.5"/>

  <!-- Subtle inner bevel -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Fork & Knife Dining Glyph -->
  <!-- Fork (Left) -->
  <path d="M22 17 V28 C22 30.2 23.8 32 26 32 V47 C26 48.1 26.9 49 28 49 C29.1 49 30 48.1 30 47 V32 C32.2 32 34 30.2 34 28 V17 M25 17 V24 M31 17 V24" 
        stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-4, -1) scale(0.95)" />

  <!-- Knife (Right) -->
  <path d="M42 16 C38 18 36 22 36 28 C36 31 37.5 33 39 34 V47 C39 48.1 39.9 49 41 49 C42.1 49 43 48.1 43 47 V16 Z" 
        fill="white" transform="translate(1, -1) scale(0.95)" />

  <!-- Coral Sparkle / Dot Accent (#FF625E) -->
  <circle cx="48" cy="15" r="3.5" fill="#FF625E" stroke="white" stroke-width="1" filter="url(#shadow)"/>
</svg>
